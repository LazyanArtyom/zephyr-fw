# ESP32 OLED board application defaults.

# Board hardware uses a 4 MB external flash.
CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y

CONFIG_FW_SHELL=y
CONFIG_FW_HEALTH_HEARTBEAT=n
CONFIG_FW_CMD_FW=y
CONFIG_FW_CMD_BOARD=y
CONFIG_FW_CMD_SYSTEM=y
CONFIG_FW_CMD_HEALTH=y
CONFIG_FW_CMD_I2CDETECT=y

# I2C diagnostics.
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SHELL_GETOPT=y
