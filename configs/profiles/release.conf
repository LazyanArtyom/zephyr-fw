# Release configuration.
#
# Keep warning/error logs visible and compile info logs only for modules that
# explicitly opt in through their module log-level Kconfig choice.

CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=2
CONFIG_LOG_MAX_LEVEL=3
CONFIG_ASSERT=n

# Release policy: shell remains available for validation, hardware watchdog on.
CONFIG_FW_SERVICE_WATCHDOG=y
CONFIG_FW_SERVICE_WATCHDOG_TIMEOUT_MS=10000
CONFIG_FW_SERVICE_WATCHDOG_FEED_INTERVAL_MS=2500
