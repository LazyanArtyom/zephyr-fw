# Service diagnostics configuration.
#
# Use for controlled support images: production-like assertions/debug policy,
# but verbose logging and the interactive shell remain available.

CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_ASSERT=n
CONFIG_DEBUG=n
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
