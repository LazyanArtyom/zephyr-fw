# Service diagnostics configuration.
#
# Controlled support image. It keeps production-like optimization/debug policy,
# while configs/features/diagnostics.conf adds shell-accessible crash and thread
# diagnostics. Do not ship as the normal field image.

CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_ASSERT=n
CONFIG_DEBUG=n
