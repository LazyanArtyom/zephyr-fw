# Debug configuration.
#
# Keep debug symbols/helpers enabled, but do not enable global assertions by
# default. Logs compile debug records and start at info level; use the shell log
# command to raise individual modules while debugging.

CONFIG_DEBUG=y

# 0 = off
# 1 = error
# 2 = warning
# 3 = info
# 4 = debug
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4

CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
