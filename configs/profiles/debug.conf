# Debug configuration.
#
# Developer bring-up build. Runtime logs start at info level, and runtime
# diagnostics are added by configs/features/diagnostics.conf.

# Zephyr's global DEBUG option selects DEBUG_OPTIMIZATIONS (-Og). On ESP32
# MCUboot images that can stall the app-side Espressif image loader before the
# IROM/DROM segments are mapped after handoff. Keep debug builds boot-safe while
# retaining the debug profile's logs and diagnostics.
CONFIG_DEBUG=n
CONFIG_SIZE_OPTIMIZATIONS=y

# 0 = off
# 1 = error
# 2 = warning
# 3 = info
# 4 = debug
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4

# Developer policy: keep watchdog available with a forgiving timeout.
CONFIG_FW_SERVICE_WATCHDOG=y
CONFIG_FW_SERVICE_WATCHDOG_TIMEOUT_MS=30000
CONFIG_FW_SERVICE_WATCHDOG_FEED_INTERVAL_MS=5000
