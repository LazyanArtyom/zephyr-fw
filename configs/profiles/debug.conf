# Debug configuration.
#
# Keep debug symbols/helpers enabled, but do not enable global assertions or
# global debug logs by default. Both are useful during focused bring-up but noisy
# for the normal interactive shell workflow.

CONFIG_DEBUG=y

# 0 = off
# 1 = error
# 2 = warning
# 3 = info
# 4 = debug
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
