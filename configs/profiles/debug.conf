# Debug configuration.
#
# Developer bring-up build. Debug symbols/helpers are enabled and runtime logs
# start at info level. Runtime diagnostics are added by configs/features/diagnostics.conf.

CONFIG_DEBUG=y

# 0 = off
# 1 = error
# 2 = warning
# 3 = info
# 4 = debug
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4

# Developer policy: keep watchdog available with a forgiving timeout.
CONFIG_FW_SERVICE_WATCHDOG=y
CONFIG_FW_SERVICE_WATCHDOG_TIMEOUT_MS=30000
CONFIG_FW_SERVICE_WATCHDOG_FEED_INTERVAL_MS=5000
