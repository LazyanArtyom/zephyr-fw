# Production configuration.
#
# Field builds are quiet: only errors are emitted by default, while warnings may
# still be compiled for modules that explicitly need them. Enable shell or more
# verbose logs only for controlled service builds.

CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=1
CONFIG_LOG_MAX_LEVEL=2
CONFIG_ASSERT=n
CONFIG_DEBUG=n
CONFIG_THREAD_MONITOR=n
CONFIG_INIT_STACKS=n

CONFIG_FW_HEALTH_HEARTBEAT=n
