# Runtime diagnostics for developer and controlled service builds.
#
# This fragment is intentionally not included in normal production field builds.
# It keeps crash and thread forensics available when a developer/support image is
# needed without turning production logging into a noisy debug stream.

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y

CONFIG_XTENSA_ENABLE_BACKTRACE=y

CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=n

CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_DEBUG_COREDUMP_SHELL=y
