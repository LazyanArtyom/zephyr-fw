# Disable the interactive shell for production-style builds.

CONFIG_FW_SHELL=n
CONFIG_SHELL=n
CONFIG_KERNEL_SHELL=n

# Keep production/no-shell builds free of Kconfig dependency warnings.
CONFIG_SHELL_GETOPT=n
CONFIG_I2C_SHELL=n

CONFIG_FW_CMD_FW=n
CONFIG_FW_CMD_BOARD_INFO=n
CONFIG_FW_CMD_SYSTEM=n
CONFIG_FW_CMD_HEALTH=n
CONFIG_FW_CMD_SETTINGS=n
CONFIG_FW_CMD_I2CDETECT=n
