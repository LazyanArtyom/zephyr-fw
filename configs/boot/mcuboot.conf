# MCUboot application-side configuration.
#
# Build with scripts/build.sh --boot mcuboot to use Zephyr sysbuild.
CONFIG_BOOTLOADER_MCUBOOT=y
# Keep sysbuild-provided MCUboot footer sizing valid and make rollback/update
# metadata available to the application without enabling any management transport.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
