# MCUboot child-image defaults.
#
# Keep production signing keys outside the repository. Signing type and key
# selection are controlled by sysbuild so MCUboot and the app agree.

# ESP32 MCUboot SoC fragments default MCUboot logging to off. Keep it verbose
# while validating the boot chain; production packages still disable the
# application shell and keep application logs quiet.
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_DBG=y
